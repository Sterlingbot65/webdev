<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🚀 JavaScript Fundamentals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🚀 JavaScript Fundamentals Assignment</h1>

  <section>
    <h2>Part 1: Basics</h2>
    <button id="checkAgeBtn">Check Age</button>
    <p id="ageResult"></p>
  </section>

  <section>
    <h2>Part 2: Functions</h2>
    <button id="calcBtn">Calculate Total</button>
    <p id="totalResult"></p>
  </section>

  <section>
    <h2>Part 3: Loops</h2>
    <button id="loopBtn">Generate Numbers</button>
    <ul id="numberList"></ul>
  </section>

  <section>
    <h2>Part 4: DOM Manipulation</h2>
    <button id="toggleBtn">Toggle Highlight</button>
    <p id="toggleText">Click the button to highlight me!</p>

    <button id="addItemBtn">Add List Item</button>
    <ul id="dynamicList"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
